# FPP attestation ledger validation.
#
# One job with one stable name (ledger-validation) runs in all three modes so a single required
# status check can protect main. The mode is derived by scripts/ci-context.py from runner-provided
# event data plus the committed steward actor allowlist, never from contributor-controlled text.
#
#   pull_request -> main from anywhere except a base-repo admission/* branch : intake
#   pull_request -> main from a base-repo admission/* branch by a steward     : admission
#   push to main                                                              : main
#
# In intake mode the diff is classified by validate.py as a declaration intake or a maintenance
# proposal (GOVERNANCE.md §5a). For pull requests the ledger rules are applied by the validators as
# they exist at the base commit, staged outside the checkout, so a contributor's edit to scripts/
# is tested by this run but is never the copy that judges its own admissibility. A pull_request
# workflow still executes the head's copy of this file; a change to .github/ is therefore reported
# as rules-sensitive and the steward reviews the diff, not only the check result.
#
# The check is defined here but is not frozen as the live contract until I2 proves it against the
# queried GitHub repository settings (docs/plans/2026-08-30-fpp-attestation-ledger-v1-staged.md §5).

name: ledger-validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ledger-validation-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  ledger-validation:
    name: ledger-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact head commit with full history
        uses: actions/checkout@v4
        with:
          # For pull requests validate the contributor's head, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install GnuPG
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnupg
          gpg --version | head -n 1

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Derive validation mode and trusted context
        id: ctx
        run: python scripts/ci-context.py --out "$RUNNER_TEMP/ledger-context.json"

      - name: Lint and type-check validators and tests (configured in pyproject.toml)
        run: |
          set -euo pipefail
          python -m ruff check scripts tests
          python -m ruff format --check scripts tests
          python -m mypy

      - name: Run validator test suite (the proposed code, including a maintenance PR's changes)
        run: python -m pytest -q

      - name: Select the validators that judge this run
        id: validators
        env:
          MODE: ${{ steps.ctx.outputs.mode }}
          BASE_SHA: ${{ steps.ctx.outputs.base_sha }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "intake" ]; then
            # Contributor PR: apply the rules as committed at the base, staged outside the checkout so the
            # working tree still equals HEAD. A maintenance PR's own scripts are exercised by pytest above,
            # not trusted to approve themselves.
            git cat-file -e "${BASE_SHA}^{commit}"
            mkdir -p "$RUNNER_TEMP/base-validators"
            git archive "$BASE_SHA" scripts | tar -x -C "$RUNNER_TEMP/base-validators"
            echo "dir=$RUNNER_TEMP/base-validators/scripts" >> "$GITHUB_OUTPUT"
            echo "source=base ${BASE_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=scripts" >> "$GITHUB_OUTPUT"
            echo "source=head" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate declarations
        env:
          MODE: ${{ steps.ctx.outputs.mode }}
          BASE_SHA: ${{ steps.ctx.outputs.base_sha }}
          CONTEXT: ${{ steps.ctx.outputs.context }}
          VALIDATORS: ${{ steps.validators.outputs.dir }}
        run: |
          set -euo pipefail
          echo "validators: ${{ steps.validators.outputs.source }}"
          if [ "$MODE" = "main" ]; then
            python "$VALIDATORS/validate.py" --mode main --all --context "$CONTEXT" --summary
          else
            git cat-file -e "${BASE_SHA}^{commit}"
            python "$VALIDATORS/validate.py" --mode "$MODE" --all --base-ref "$BASE_SHA" --context "$CONTEXT"
          fi

      - name: Verify steward signatures and admission chains
        env:
          MODE: ${{ steps.ctx.outputs.mode }}
          BASE_SHA: ${{ steps.ctx.outputs.base_sha }}
          CONTEXT: ${{ steps.ctx.outputs.context }}
          VALIDATORS: ${{ steps.validators.outputs.dir }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "main" ]; then
            python "$VALIDATORS/verify-signatures.py" --mode main --context "$CONTEXT"
          else
            python "$VALIDATORS/verify-signatures.py" --mode "$MODE" --base-ref "$BASE_SHA" --context "$CONTEXT"
          fi
